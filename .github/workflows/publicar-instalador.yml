# Compila el instalador del nodo de cada producto, lo PRUEBA en Windows y lo
# publica en el Release del tag (ADR-010).
#
# - Con un tag vX.Y.Z: arma, prueba y publica los tres instaladores en el
#   Release de ese tag, con nombres fijos (libraedge-nodo-<producto>.exe), asi
#   el link de librasuite.com.ar y el de la pantalla del central no cambian:
#   https://github.com/marianocappucci/libraedge/releases/latest/download/libraedge-nodo-<producto>.exe
# - A mano (workflow_dispatch): arma y prueba; publica solo si se pide y se
#   corre sobre un tag.
#
# El instalador no lleva secretos: el del nodo viaja en la carga
# (carga-nodo.json), que emite el central. Por eso puede ser publico.
#
# La prueba es la de PROBAR_EN_VM.md (V4 a V7) sobre el runner de Windows: sin
# /CARGA tiene que salir con 1; con la carga de prueba (un central que no
# existe), instalar con 0, verificar_nodo.ps1 -SinCentral con 0 y ningun
# secreto en los logs. Si algo falla, no se publica nada.
#
# Con el codigo de vinculacion (ADR-014): en el runner se levanta un central de
# prueba con https de verdad (tests/central_de_prueba.py: el router del motor,
# create_nodos_router + create_canje_router, sobre SQLite, con su autoridad
# instalada en el almacen del sistema) y Windows y Ubuntu se instalan con
# direccion + codigo; se verifica que el secreto que quedo en el nodo.env es el
# que verifica el central, que el codigo no sirve dos veces y que ni el codigo
# ni el secreto quedan en los logs.
#
# Linux (ADR-012): un .deb por producto (libraedge-nodo-<producto>_<version>_amd64.deb,
# y el alias libraedge-nodo-<producto>_amd64.deb para releases/latest/download/),
# armado en ubuntu-22.04 e instalado y verificado en ubuntu-22.04, ubuntu-24.04 y ubuntu-26.04
# (los runners tienen systemd y sudo): sin carga no configura, con la carga de
# prueba configura y verificar_nodo.sh --sin-central da 0, el respaldo restaura,
# reinstalar encima conserva SECRET_KEY, desinstalar conserva los datos y ningun
# secreto queda en los logs.
#
# La version de escritorio (ADR-015): el job `escritorio` compila la app (Tauri 2, escritorio/) de los tres productos
# en Windows y en Ubuntu 22.04 (la glibc y el WebKitGTK 4.1 mas viejos que se soportan: el mismo binario anda en
# 24.04 y 26.04), con la compilacion de Rust en cache. Va dentro del .exe y del .deb; se prueba que arranca y
# carga el producto local (xvfb-run en Ubuntu; en Windows, un arranque cronometrado con el proceso vivo y el
# "GET /" en el log del producto), que sin vincular muestra «Vincular con el sistema», que vincula con el central
# de prueba (pkexec / UAC), que vuelve sola si el producto se reinicia, que el acceso directo y el .desktop
# apuntan a ella y que desinstalar la saca.
name: Publicar instalador

on:
  push:
    tags: ["v*"]
  # Un PR que toca el instalador se prueba en Windows (sin publicar): la VM de
  # 2026-10-19 encontro seis bugs que los tests de Linux no veian.
  pull_request:
    branches: [develop, main]
    paths:
      - "instalador/**"
      - "libraedge/instalador.py"
      - "escritorio/**"
      - "libraedge/pantalla_del_central.py"
      - "libraedge/vinculacion.py"
      - "tests/central_de_prueba.py"
      - "tests/login_por_http.py"
      - ".github/central-de-prueba.sh"
      - ".github/workflows/publicar-instalador.yml"
  workflow_dispatch:
    inputs:
      ref_producto:
        description: "Rama o tag de los productos que entra en el instalador"
        default: main
      publicar:
        description: "Publicar en el Release del tag (solo si se corre sobre un tag)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publicar-instalador-${{ github.ref }}
  cancel-in-progress: false

env:
  # Lo que esta en produccion: los clientes corren main.
  REF_PRODUCTO: ${{ inputs.ref_producto || 'main' }}

jobs:
  escritorio:
    name: app de escritorio en ${{ matrix.so }}
    runs-on: ${{ matrix.so }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      # Firma de codigo (ADR-015): con el secreto cargado, armar.py firma cada .exe. Hoy no hay certificado.
      LIBRAEDGE_FIRMA_CMD: ${{ secrets.LIBRAEDGE_FIRMA_CMD }}
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotecas de WebKitGTK 4.1 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev build-essential pkg-config > /dev/null
      - name: Rust estable
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: escritorio
          key: ${{ matrix.so }}
      - name: Pruebas de la app (cargo test)
        if: runner.os == 'Linux'
        working-directory: escritorio
        run: cargo test --locked
      - name: Compilar la app de los tres productos
        run: |
          v=0.0.0
          if [ "${{ github.ref_type }}" = tag ]; then v="${GITHUB_REF_NAME#v}"; fi
          python escritorio/armar.py --version "$v" --salida _escritorio restolibra ventalibra contalibra
          ls -l _escritorio
      - uses: actions/upload-artifact@v4
        with:
          name: escritorio-${{ runner.os }}
          path: _escritorio
          retention-days: 7

  paquete:
    name: paquete ${{ matrix.producto }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        producto: [restolibra, ventalibra, contalibra]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: marianocappucci/${{ matrix.producto }}
          ref: ${{ env.REF_PRODUCTO }}
          path: _producto
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # PostgreSQL, Python embebido, NSSM y VC++: lo mismo para los tres.
      - uses: actions/cache@v4
        with:
          path: instalador/paquete/.descargas
          key: descargas-${{ hashFiles('instalador/armar_paquete.sh') }}
      - name: Armar el paquete
        run: instalador/armar_paquete.sh ${{ matrix.producto }} _producto
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-${{ matrix.producto }}
          path: |
            instalador/paquete
            !instalador/paquete/.descargas
          retention-days: 3
      # El frontend construido, para el .deb (asi no se construye dos veces).
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.producto }}
          path: instalador/paquete/${{ matrix.producto }}/producto/frontend/dist
          retention-days: 3

  deb:
    name: deb ${{ matrix.producto }}
    needs: [paquete, escritorio]
    # En 22.04: lo que se compile de fuente queda contra la glibc mas vieja que se soporta.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        producto: [restolibra, ventalibra, contalibra]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: marianocappucci/${{ matrix.producto }}
          ref: ${{ env.REF_PRODUCTO }}
          path: _producto
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ matrix.producto }}
          path: _frontend
      - uses: actions/download-artifact@v4
        with:
          name: escritorio-Linux
          path: _escritorio
      - name: Armar el .deb
        run: |
          v=0.0.0
          if [ "${{ github.ref_type }}" = tag ]; then v="${GITHUB_REF_NAME#v}"; fi
          instalador/linux/armar_deb.sh ${{ matrix.producto }} _producto --frontend-dist _frontend --version "$v" \
            --escritorio _escritorio
          dpkg-deb -c instalador/salida/*.deb | grep -E "opt/libraedge-nodo/escritorio/libraedge-nodo-${{ matrix.producto }}$"
          dpkg-deb -c instalador/salida/*.deb | grep -q "usr/share/polkit-1/actions/ar.com.librasuite.libraedge-nodo.policy"
      - name: Los scripts del paquete pasan shellcheck
        run: |
          mkdir -p _control && dpkg-deb -e instalador/salida/*.deb _control
          shellcheck _control/preinst _control/postinst _control/prerm _control/postrm
          dpkg-deb -I instalador/salida/*.deb
      - name: Nombre fijo
        run: |
          mkdir -p publicar
          cp instalador/salida/*.deb publicar/
          cp instalador/salida/*.deb "publicar/libraedge-nodo-${{ matrix.producto }}_amd64.deb"
          ls -l publicar
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.producto }}
          path: publicar
          retention-days: 7

  probar-deb:
    name: probar deb ${{ matrix.producto }} en ${{ matrix.ubuntu }}
    needs: deb
    runs-on: ${{ matrix.ubuntu }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        producto: [restolibra, ventalibra, contalibra]
        ubuntu: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    env:
      DEB: libraedge-nodo-${{ matrix.producto }}_amd64.deb
      PAQUETE: libraedge-nodo-${{ matrix.producto }}
      SECRETO_DE_PRUEBA: prueba-prueba-prueba-prueba-prueba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.producto }}
          path: deb
      - name: PostgreSQL 16 de PGDG (apt.postgresql.org)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          apt-cache policy postgresql-16 | head -n 4
      - name: Con las recomendadas, apt resuelve la bandeja
        run: |
          sudo apt-get install -s "./deb/$DEB" > "$RUNNER_TEMP/simulado.txt"
          # La extension viene en gnome-shell-extension-appindicator (22.04 y 24.04) o en
          # gnome-shell-ubuntu-extensions (26.04): el .deb la recomienda como alternativa.
          for p in python3-gi gir1.2-ayatanaappindicator3-0.1; do
            grep -q "^Inst $p " "$RUNNER_TEMP/simulado.txt" || dpkg -s "$p" > /dev/null 2>&1 \
              || { echo "apt no instalaria $p"; exit 1; }
          done
          # La que apt elija de la alternativa (o la que ya este instalada).
          ext=""
          for p in gnome-shell-extension-appindicator gnome-shell-ubuntu-extensions; do
            if grep -q "^Inst $p " "$RUNNER_TEMP/simulado.txt" || dpkg -s "$p" > /dev/null 2>&1; then ext=$p; break; fi
          done
          [ -n "$ext" ] || { echo "apt no instalaria la extension de la bandeja"; grep "^Inst" "$RUNNER_TEMP/simulado.txt"; exit 1; }
          echo "extension en $ext" >> "$GITHUB_STEP_SUMMARY"
          # La extension, y que Ubuntu Desktop la trae habilitada para todos: el modo «ubuntu» de
          # GNOME Shell (gnome-shell-common, modes/ubuntu.json) la lista en enabledExtensions.
          mkdir -p _pkgs && cd _pkgs
          apt-get download -q "$ext" gnome-shell-common
          dpkg-deb -c "${ext}"_*.deb | grep -o "extensions/ubuntu-appindicators@ubuntu.com/metadata.json"
          dpkg-deb -x gnome-shell-common_*.deb x
          cat x/usr/share/gnome-shell/modes/ubuntu.json
          grep -q '"ubuntu-appindicators@ubuntu.com"' x/usr/share/gnome-shell/modes/ubuntu.json
      # Los favoritos del dock de Ubuntu Desktop (ADR-013): el esquema de GNOME Shell y los valores por defecto de
      # cada version (ubuntu-settings), sin el escritorio entero. Se guardan antes de instalar el nodo.
      - name: Los favoritos del dock de Ubuntu, antes de instalar
        run: |
          sudo apt-get install -y -q --no-install-recommends gnome-shell-common ubuntu-settings libglib2.0-bin > /dev/null
          for d in GNOME ubuntu:GNOME; do
            env -i PATH=/usr/bin:/bin HOME=/nonexistent GSETTINGS_BACKEND=memory XDG_CURRENT_DESKTOP=$d \
              gsettings get org.gnome.shell favorite-apps | tee "$RUNNER_TEMP/favoritos-antes-${d%%:*}.txt"
          done
          grep -q "\.desktop" "$RUNNER_TEMP/favoritos-antes-ubuntu.txt"
      - name: Instalar sin carga no configura
        run: |
          sudo apt-get install -y -q --no-install-recommends "./deb/$DEB" 2>&1 | tee "$RUNNER_TEMP/apt-sin-carga.log"
          test ! -e /etc/libraedge-nodo/nodo.env
          if systemctl is-active --quiet libraedge-producto; then echo "el producto no tenia que arrancar"; exit 1; fi
          set +e
          sudo libraedge-nodo-instalar > "$RUNNER_TEMP/instalar-sin-carga.log" 2>&1
          codigo=$?
          set -e
          cat "$RUNNER_TEMP/instalar-sin-carga.log"
          [ "$codigo" -ne 0 ] || { echo "Sin carga tenia que salir con algo distinto de 0"; exit 1; }
          test ! -e /etc/libraedge-nodo/nodo.env
      - name: La app de escritorio sin vincular muestra «Vincular con el sistema» (ADR-015)
        run: |
          sudo apt-get install -y -q --no-install-recommends xvfb xauth xdotool dbus > /dev/null
          app="/opt/libraedge-nodo/escritorio/$PAQUETE"
          test -x "$app"
          # Las bibliotecas las trajo el Depends del .deb (con --no-install-recommends).
          if ldd "$app" | grep -q "not found"; then ldd "$app" | grep "not found"; exit 1; fi
          "$app" --version | tee /dev/stderr | grep -q "producto ${{ matrix.producto }},"
          informe="$RUNNER_TEMP/informe-sin-vincular.txt"
          # En la misma pantalla virtual: arranca, muestra «vincular» y la ventana tiene el WM_CLASS del .desktop
          # (StartupWMClass), que es lo que agrupa la ventana con el favorito del dock.
          LIBRAEDGE_ESCRITORIO_INFORME="$informe" APP="$app" timeout 120 xvfb-run -a dbus-run-session -- bash -c '
            "$APP" > "$RUNNER_TEMP/app-sin-vincular.log" 2>&1 &
            for _ in $(seq 1 60); do grep -qx "pantalla vincular" "$LIBRAEDGE_ESCRITORIO_INFORME" 2> /dev/null && break; sleep 1; done
            sleep 2
            xdotool search --classname "^$(basename "$APP")\$" > "$RUNNER_TEMP/ventanas.txt" || true
            kill $!' || true
          cat "$informe" "$RUNNER_TEMP/app-sin-vincular.log" || true
          grep -qx "pantalla vincular" "$informe" || { echo "La app no mostro «Vincular con el sistema»"; exit 1; }
          if grep -q "^producto " "$informe"; then echo "sin vincular no tenia que cargar el producto"; exit 1; fi
          [ -s "$RUNNER_TEMP/ventanas.txt" ] || { echo "No hay ventana con WM_CLASS $PAQUETE"; exit 1; }
      - name: El acceso directo queda fijado en el dock de todos los usuarios (ADR-013)
        run: |
          cat /usr/share/glib-2.0/schemas/90_libraedge-nodo.gschema.override
          for d in GNOME ubuntu:GNOME; do
            ahora="$(env -i PATH=/usr/bin:/bin HOME=/nonexistent GSETTINGS_BACKEND=memory XDG_CURRENT_DESKTOP=$d \
              gsettings get org.gnome.shell favorite-apps)"
            echo "$d: $ahora"
            antes="$(cat "$RUNNER_TEMP/favoritos-antes-${d%%:*}.txt")"
            # Los del sistema, en el mismo orden, y el nuestro al final.
            [ "$ahora" = "${antes%]}, '$PAQUETE.desktop']" ] || { echo "favorite-apps no es el de antes mas $PAQUETE.desktop"; exit 1; }
          done
      - name: Una carga de otro producto se rechaza sin tocar nada
        run: |
          otro=$(for p in restolibra ventalibra contalibra; do [ "$p" = "${{ matrix.producto }}" ] || { echo "$p"; break; }; done)
          jq --arg p "$otro" '.producto = $p' instalador/carga-de-prueba.json > "$RUNNER_TEMP/carga-otra.json"
          set +e
          sudo libraedge-nodo-instalar "$RUNNER_TEMP/carga-otra.json" > "$RUNNER_TEMP/instalar-otra.log" 2>&1
          codigo=$?
          set -e
          cat "$RUNNER_TEMP/instalar-otra.log"
          [ "$codigo" -ne 0 ] || { echo "Una carga de $otro tenia que rechazarse"; exit 1; }
          if pg_lsclusters --no-header | grep -q " libraedge "; then echo "no tenia que crear el cluster"; exit 1; fi
      - name: Configurar con la carga de prueba
        run: |
          jq --arg p "${{ matrix.producto }}" '.producto = $p' instalador/carga-de-prueba.json > "$RUNNER_TEMP/carga.json"
          chmod 600 "$RUNNER_TEMP/carga.json"
          sudo libraedge-nodo-instalar "$RUNNER_TEMP/carga.json" 2>&1 | tee "$RUNNER_TEMP/instalar.log"
          exit "${PIPESTATUS[0]}"
      - name: El acceso directo del producto y como se entra (ADR-013)
        run: |
          sudo apt-get install -y -q desktop-file-utils > /dev/null
          nombre="$(jq -r .nombre "instalador/productos/${{ matrix.producto }}.json")"
          puerto="$(jq -r .puerto "instalador/productos/${{ matrix.producto }}.json")"
          desktop="/usr/share/applications/$PAQUETE.desktop"
          cat "$desktop"
          desktop-file-validate "$desktop"
          grep -qx "Name=$nombre" "$desktop"
          # La app de escritorio (ADR-015), con el WM_CLASS del binario; el navegador queda como accion de respaldo.
          grep -qx "Exec=/opt/libraedge-nodo/escritorio/$PAQUETE" "$desktop"
          grep -qx "StartupWMClass=$PAQUETE" "$desktop"
          grep -qx "Exec=/opt/libraedge-nodo/bandeja/abrir_producto.sh --navegador http://localhost:$puerto/" "$desktop"
          icono="$(sed -n 's/^Icon=//p' "$desktop" | head -n1)"
          grep -q "<title>$nombre</title>" "$icono"
          # El respaldo, con un navegador falso adelante en el PATH (el runner trae Chrome de verdad).
          mkdir -p "$RUNNER_TEMP/falso"
          printf '#!/bin/sh\necho "$@" > "%s/abierto.txt"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/falso/google-chrome"
          chmod +x "$RUNNER_TEMP/falso/google-chrome"
          PATH="$RUNNER_TEMP/falso:$PATH" /opt/libraedge-nodo/bandeja/abrir_producto.sh --navegador "http://localhost:$puerto/"
          grep -qx -- "--app=http://localhost:$puerto/" "$RUNNER_TEMP/abierto.txt"
          # El final de la instalacion dice como se entra, con la IP privada de esta PC.
          grep -q "se entra siempre por la copia local" "$RUNNER_TEMP/instalar.log"
          grep -q "con el acceso directo \"$nombre\" (o http://localhost:$puerto/)" "$RUNNER_TEMP/instalar.log"
          grep -Eq "desde las otras cajas, con http://(10|172|192)\.[0-9.]+:$puerto\$" "$RUNNER_TEMP/instalar.log"
      - name: Verificar (--sin-central)
        run: |
          sleep 75
          if ! sudo libraedge-nodo-verificar --sin-central; then
            sudo journalctl -u libraedge-producto -u libraedge-nodo -n 80 --no-pager
            exit 1
          fi
      - name: Login real por http, como desde otra caja (cookie sin Secure, ADR-016)
        # El nodo sirve el producto por http: con la cookie de sesion Secure el login da 200 y el pedido siguiente 401
        # (libraauth ADR-026). Se entra con el admin local (su clave sale del nodo.env y no se imprime) contra la IP de
        # la red local, sin la excepcion de localhost. Solo se exige el arreglo si el producto ya trae libraauth >= 0.53.0.
        run: |
          py=/opt/libraedge-nodo/python/bin/python3
          puerto="$(jq -r .puerto "instalador/productos/${{ matrix.producto }}.json")"
          sudo grep -qx 'LIBRAAUTH_COOKIE_SECURE=0' /etc/libraedge-nodo/nodo.env \
            || { echo "El nodo.env no apaga la marca Secure de la cookie"; exit 1; }
          read -r version estado < <("$py" -I tests/login_por_http.py version)
          echo "libraauth $version en el nodo ($estado)"
          case "$estado" in nueva|vieja) ;; *) echo "No se pudo leer la version de libraauth del nodo"; exit 1;; esac
          ip="$(grep -Eo "http://(10|172|192)\.[0-9.]+:$puerto" "$RUNNER_TEMP/instalar.log" | tail -n1 | sed -E 's#^http://##; s#:[0-9]+$##')"
          [ -n "$ip" ] || { echo "No esta la IP de la red local en el log de la instalacion"; exit 1; }
          base="http://$ip:$puerto"
          d="$RUNNER_TEMP/login"
          mkdir -p "$d" && chmod 700 "$d"
          prefijo=""
          for p in /api /auth; do
            if curl -fsS -o "$d/desafio.json" "$base$p/captcha" 2> /dev/null; then prefijo="$p"; break; fi
          done
          [ -n "$prefijo" ] || { echo "El producto no contesta $base/api/captcha ni $base/auth/captcha"; exit 1; }
          sudo cat /etc/libraedge-nodo/nodo.env | "$py" -I tests/login_por_http.py cuerpo - "$d/desafio.json" "$d/cuerpo.json"
          codigo="$(curl -sS -o "$d/login.json" -D "$d/login.cabeceras" -c "$d/frasco" -H 'Content-Type: application/json' \
            --data-binary @"$d/cuerpo.json" -w '%{http_code}' "$base$prefijo/login")"
          rm -f "$d/cuerpo.json"
          [ "$codigo" = 200 ] || { echo "POST $prefijo/login dio $codigo"; cat "$d/login.json"; exit 1; }
          tr -d '\r' < "$d/login.cabeceras" | grep -i '^set-cookie:' > "$d/cookies" \
            || { echo "POST $prefijo/login no puso ninguna cookie"; exit 1; }
          echo "Las cookies del login (sin el valor):"
          sed -E 's/^([Ss]et-[Cc]ookie: *[^=]+=)[^;]*/\1…/' "$d/cookies"
          segura=no
          if grep -iqE ';[[:space:]]*secure[[:space:]]*(;|$)' "$d/cookies"; then segura=si; fi
          me="$(curl -sS -b "$d/frasco" -o "$d/me.json" -w '%{http_code}' "$base$prefijo/me")"
          echo "GET $prefijo/me con la cookie: $me"
          if [ "$estado" = nueva ]; then
            [ "$segura" = no ] || { echo "libraauth $version ya lee LIBRAAUTH_COOKIE_SECURE y la cookie salio Secure"; exit 1; }
            [ "$me" = 200 ] || { echo "GET $prefijo/me con la cookie del login dio $me"; cat "$d/me.json"; exit 1; }
            [ "$(jq -r .username "$d/me.json")" = admin ] || { echo "GET $prefijo/me no devolvio al admin"; exit 1; }
            echo "Login por http: cookie sin Secure y GET $prefijo/me autenticado con 200."
          else
            echo "::warning::El producto trae libraauth $version (anterior a 0.53.0): la cookie sale Secure=$segura y GET $prefijo/me da $me. Se exige cuando suba el pin."
          fi
      - name: La app abre el producto local y vuelve sola si el producto se reinicia (ADR-015)
        run: |
          app="/opt/libraedge-nodo/escritorio/$PAQUETE"
          puerto="$(jq -r .puerto "instalador/productos/${{ matrix.producto }}.json")"
          informe="$RUNNER_TEMP/informe.txt"
          esperar() {  # esperar <patron> <segundos> [<cuantas>]
            for _ in $(seq 1 "$2"); do
              n="$(grep -c -- "$1" "$informe" 2> /dev/null)" || n=0
              [ "$n" -ge "${3:-1}" ] && return 0
              sleep 1
            done
            echo "No aparecio '$1' en el informe:"; cat "$informe"; cat "$RUNNER_TEMP/app.log"; return 1
          }
          desde="$(date '+%Y-%m-%d %H:%M:%S')"
          LIBRAEDGE_ESCRITORIO_INFORME="$informe" nohup xvfb-run -a dbus-run-session -- "$app" > "$RUNNER_TEMP/app.log" 2>&1 &
          esperar "^producto http://localhost:$puerto/" 90
          sleep 5
          cat "$informe"
          pgrep -f "^$app" > /dev/null || { echo "La app no sigue viva"; cat "$RUNNER_TEMP/app.log"; exit 1; }
          # El producto vio el pedido de la ventana (no solo el de salud).
          sudo journalctl -u libraedge-producto --since "$desde" --no-pager > "$RUNNER_TEMP/producto-app.log"
          grep -E '"GET / HTTP/1\.1" [0-9]{3}' "$RUNNER_TEMP/producto-app.log" \
            || { echo "El producto no registro el GET / de la app:"; tail -n 30 "$RUNNER_TEMP/producto-app.log"; exit 1; }
          # Se cae el producto: pantalla de espera propia; vuelve: la app recarga sola.
          sudo systemctl stop libraedge-producto
          esperar "^pantalla espera$" 60
          sleep 5
          sudo systemctl start libraedge-producto
          esperar "^producto http://localhost:$puerto/" 120 2
          cat "$informe"
          pkill -f "^$app" || true
      - name: El respaldo restaura
        run: |
          sudo systemctl start libraedge-respaldo.service
          sudo journalctl -u libraedge-respaldo -n 30 --no-pager
          sudo ls -l /var/lib/libraedge-nodo/respaldos
      - name: Reinstalar encima conserva SECRET_KEY (con la carga, sin ella y con ufw activo)
        run: |
          huella() { sudo grep '^SECRET_KEY=' /etc/libraedge-nodo/nodo.env | sha256sum; }
          antes="$(huella)"
          sudo ufw --force enable
          sudo LIBRAEDGE_CARGA="$RUNNER_TEMP/carga.json" apt-get install -y -q --reinstall --no-install-recommends \
            "./deb/$DEB" 2>&1 | tee "$RUNNER_TEMP/apt-reinstalar.log"
          [ "$(huella)" = "$antes" ] || { echo "Reinstalar con la carga cambio SECRET_KEY"; exit 1; }
          sudo apt-get install -y -q --reinstall --no-install-recommends "./deb/$DEB" 2>&1 \
            | tee "$RUNNER_TEMP/apt-actualizar.log"
          [ "$(huella)" = "$antes" ] || { echo "Actualizar sin la carga cambio SECRET_KEY"; exit 1; }
          echo "$antes" > "$RUNNER_TEMP/huella.txt"  # solo el hash, para despues de desinstalar
          sudo ufw status | grep -E "^8000/tcp +ALLOW +192\.168\.0\.0/16"
          sleep 30
          sudo libraedge-nodo-verificar --sin-central
      - name: Ningun secreto en los logs
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          sudo journalctl -u 'libraedge-*' -u 'postgresql@16-libraedge' --no-pager > "$RUNNER_TEMP/logs/journal.log"
          sudo cp -r /var/log/libraedge-nodo /var/log/postgresql /var/log/apt/term.log /var/log/dpkg.log "$RUNNER_TEMP/logs/"
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/logs/"
          # La clave de PostgreSQL se busca sin mostrarla.
          clave_pg="$(sudo cat /var/lib/libraedge-nodo/postgres.clave)"
          # Y la del admin local, que uso la prueba de login por http (ADR-016).
          clave_admin="$(sudo sed -n 's/^ADMIN_PASSWORD=//p' /etc/libraedge-nodo/nodo.env)"
          for secreto in "$SECRETO_DE_PRUEBA" "$clave_pg" "$clave_admin"; do
            if grep -rqF -- "$secreto" "$RUNNER_TEMP/logs"; then
              echo "Un secreto aparece en: $(grep -rlF -- "$secreto" "$RUNNER_TEMP/logs" | tr '\n' ' ')"
              exit 1
            fi
          done
          echo "Ni el secreto del nodo ni la clave de PostgreSQL aparecen en $(find "$RUNNER_TEMP/logs" -type f | wc -l) logs."
      - name: Desinstalar borra el secreto y conserva los datos
        run: |
          # La opcion de abrir el producto al iniciar sesion (README, apagada): remove tambien la borra.
          sudo cp "/usr/share/applications/$PAQUETE.desktop" /etc/xdg/autostart/
          sudo apt-get remove -y -q "$PAQUETE"
          test ! -e "/usr/share/applications/$PAQUETE.desktop"
          test ! -e "/etc/xdg/autostart/$PAQUETE.desktop"
          # La app de escritorio y su accion de polkit (ADR-015).
          test ! -e /opt/libraedge-nodo/escritorio
          test ! -e /usr/share/polkit-1/actions/ar.com.librasuite.libraedge-nodo.policy
          # El dock vuelve a los favoritos del sistema.
          test ! -e /usr/share/glib-2.0/schemas/90_libraedge-nodo.gschema.override
          for d in GNOME ubuntu:GNOME; do
            ahora="$(env -i PATH=/usr/bin:/bin HOME=/nonexistent GSETTINGS_BACKEND=memory XDG_CURRENT_DESKTOP=$d \
              gsettings get org.gnome.shell favorite-apps)"
            [ "$ahora" = "$(cat "$RUNNER_TEMP/favoritos-antes-${d%%:*}.txt")" ] || { echo "$d: quedo $ahora"; exit 1; }
          done
          if systemctl is-active --quiet libraedge-producto; then echo "el producto sigue corriendo"; exit 1; fi
          sudo test ! -e /etc/libraedge-nodo/nodo.env
          if sudo grep -rqsF -- "$SECRETO_DE_PRUEBA" /etc/libraedge-nodo /var/lib/libraedge-nodo; then
            echo "El secreto del nodo quedo en el disco despues de desinstalar"; exit 1
          fi
          sudo test -s /var/lib/libraedge-nodo/conservado.env
          sudo stat -c '%U:%G %a' /var/lib/libraedge-nodo/conservado.env | grep -qx "root:root 600"
          sudo test -s /var/lib/libraedge-nodo/postgres.clave
          sudo test -s /var/lib/libraedge-nodo/app/config.json
          pg_lsclusters --no-header | grep " libraedge "
      - name: Reinstalar despues pide la carga y configura sobre los datos que estaban
        run: |
          sudo apt-get install -y -q --no-install-recommends "./deb/$DEB" 2>&1 | tee "$RUNNER_TEMP/apt-despues-de-remove.log"
          grep -q "SIN CONFIGURAR" "$RUNNER_TEMP/apt-despues-de-remove.log"
          sudo test ! -e /etc/libraedge-nodo/nodo.env
          if systemctl is-active --quiet libraedge-producto; then echo "sin carga no tenia que arrancar"; exit 1; fi
          set +e
          sudo libraedge-nodo-instalar > "$RUNNER_TEMP/instalar-sin-carga-2.log" 2>&1
          codigo=$?
          set -e
          [ "$codigo" -ne 0 ] || { echo "Sin carga tenia que salir con algo distinto de 0"; exit 1; }
          sudo libraedge-nodo-instalar "$RUNNER_TEMP/carga.json" 2>&1 | tee "$RUNNER_TEMP/instalar-sobre-los-datos.log"
          grep -q "Se recuperaron SECRET_KEY" "$RUNNER_TEMP/instalar-sobre-los-datos.log"
          grep -q "El cluster 16/libraedge ya existe" "$RUNNER_TEMP/instalar-sobre-los-datos.log"
          huella="$(sudo grep '^SECRET_KEY=' /etc/libraedge-nodo/nodo.env | sha256sum)"
          [ "$huella" = "$(cat "$RUNNER_TEMP/huella.txt")" ] || { echo "SECRET_KEY cambio al reinstalar"; exit 1; }
          sudo test ! -e /var/lib/libraedge-nodo/conservado.env
          sleep 30
          sudo libraedge-nodo-verificar --sin-central
      - name: purge borra la configuracion y deja los datos
        run: |
          sudo apt-get purge -y -q "$PAQUETE"
          sudo test ! -e /etc/libraedge-nodo
          if sudo grep -rqsF -- "$SECRETO_DE_PRUEBA" /var/lib/libraedge-nodo; then echo "quedo el secreto"; exit 1; fi
          sudo test -s /var/lib/libraedge-nodo/postgres.clave
          sudo test -s /var/lib/libraedge-nodo/app/config.json
          pg_lsclusters --no-header | grep " libraedge "
          test ! -e /opt/libraedge-nodo/python
      - uses: astral-sh/setup-uv@v6
      - name: Un central de prueba con https (ADR-014)
        run: bash .github/central-de-prueba.sh levantar "${{ matrix.producto }}"
      - name: Instalar con el codigo (apt con LIBRAEDGE_CODIGO) y reinstalar con libraedge-nodo-instalar --codigo
        run: |
          . .github/central-de-prueba.sh
          alta="$(emitir /vinculacion '{"sucursal_id": "1"}')"
          node_id="$(jq -r .node_id <<< "$alta")"; codigo="$(jq -r .codigo <<< "$alta")"
          echo "::add-mask::$codigo"
          [ "$(jq -r .direccion <<< "$alta")" = "$DIRECCION" ]
          echo "$codigo" >> "$RUNNER_TEMP/codigos.txt"
          sudo LIBRAEDGE_CODIGO="$codigo" LIBRAEDGE_DIRECCION="$DIRECCION" apt-get install -y -q --no-install-recommends \
            "./deb/$DEB" 2>&1 | tee "$RUNNER_TEMP/apt-con-codigo.log"
          [ "${PIPESTATUS[0]}" = 0 ]
          secreto_ok "$node_id"
          sudo test ! -e /var/lib/libraedge-nodo/carga-nodo.json  # la carga canjeada no queda
          [ "$(canje_http "$codigo")" = 404 ] || { echo "El codigo sirvio dos veces"; exit 1; }
          huella_vieja="$(huella_del_secreto)"

          # Otro codigo para el mismo nodo (reinstalar la misma PC), por la linea de comandos.
          otro="$(emitir "/$node_id/vinculacion")"
          codigo2="$(jq -r .codigo <<< "$otro")"; echo "::add-mask::$codigo2"; echo "$codigo2" >> "$RUNNER_TEMP/codigos.txt"
          sudo libraedge-nodo-instalar --codigo "$codigo2" --direccion "$DIRECCION" 2>&1 | tee "$RUNNER_TEMP/instalar-con-codigo.log"
          [ "${PIPESTATUS[0]}" = 0 ]
          secreto_ok "$node_id"
          [ "$(huella_del_secreto)" != "$huella_vieja" ] || { echo "El canje no cambio el secreto"; exit 1; }

          # Un codigo usado no toca nada (sale con 2 antes de tocar la base).
          antes="$(huella_del_secreto)"
          set +e
          sudo libraedge-nodo-instalar --codigo "$codigo2" --direccion "$DIRECCION" > "$RUNNER_TEMP/instalar-codigo-usado.log" 2>&1
          r=$?
          set -e
          cat "$RUNNER_TEMP/instalar-codigo-usado.log"
          [ "$r" = 2 ] || { echo "Con un codigo usado tenia que salir con 2 y salio con $r"; exit 1; }
          grep -q "no es válido o ya venció" "$RUNNER_TEMP/instalar-codigo-usado.log"
          [ "$(huella_del_secreto)" = "$antes" ]

          # Desde la app (ADR-015): la misma funcion que «Vincular con el sistema», por pkexec y la accion de polkit,
          # con el codigo por la entrada. Como root, polkit autoriza sin pedir clave (en una PC la pide el agente).
          sudo apt-get install -y -q --no-install-recommends pkexec > /dev/null 2>&1 \
            || sudo apt-get install -y -q --no-install-recommends policykit-1 > /dev/null
          otro3="$(emitir "/$node_id/vinculacion")"
          codigo3="$(jq -r .codigo <<< "$otro3")"; echo "::add-mask::$codigo3"; echo "$codigo3" >> "$RUNNER_TEMP/codigos.txt"
          printf '%s\n' "$codigo3" | sudo "/opt/libraedge-nodo/escritorio/$PAQUETE" --vincular --direccion "$DIRECCION" \
            2>&1 | tee "$RUNNER_TEMP/app-vincular.log"
          [ "${PIPESTATUS[1]}" = 0 ]
          secreto_ok "$node_id"
          [ "$(huella_del_secreto)" != "$antes" ] || { echo "Vincular desde la app no cambio el secreto"; exit 1; }
          sudo journalctl --since "-5min" --no-pager | grep -E "pkexec.*instalar\.sh" | tail -n 3
          sleep 30
          sudo libraedge-nodo-verificar --sin-central
      - name: Ni el codigo ni el secreto en los logs (ADR-014)
        run: |
          . .github/central-de-prueba.sh
          sin_secretos_en_los_logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-deb-${{ matrix.producto }}-${{ matrix.ubuntu }}
          path: ${{ runner.temp }}/logs
          retention-days: 7

  compilar:
    name: compilar y probar ${{ matrix.producto }}
    needs: [paquete, escritorio]
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        producto: [restolibra, ventalibra, contalibra]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: paquete-${{ matrix.producto }}
          path: instalador/paquete
      # La app de escritorio (ADR-015): el .iss la toma de paquete\escritorio\<producto>.exe.
      - uses: actions/download-artifact@v4
        with:
          name: escritorio-Windows
          path: instalador/paquete/escritorio
      # El runtime de WebView2 que usa la app (Windows 11 y Windows 10 con Edge al dia lo traen).
      - name: WebView2
        run: |
          $id = "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $pv = (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$id" -ErrorAction SilentlyContinue).pv
          if (-not $pv -or $pv -eq "0.0.0.0") {
            Write-Host "Instalando el runtime de WebView2..."
            Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:RUNNER_TEMP\wv2.exe"
            Start-Process "$env:RUNNER_TEMP\wv2.exe" -ArgumentList "/silent", "/install" -Wait
            $pv = (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$id").pv
          }
          Write-Host "WebView2 $pv"
      - name: Version
        id: version
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Compilar (V3)
        working-directory: instalador
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DProducto=${{ matrix.producto }} /DVersion=${{ steps.version.outputs.version }} nodo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem salida
      - name: Sin carga no instala (V4)
        run: |
          $exe = (Get-ChildItem instalador\salida\*.exe).FullName
          $p = Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$env:RUNNER_TEMP\inno-sin-carga.log" -Wait -PassThru
          if ($p.ExitCode -ne 1) { throw "Sin /CARGA tenia que salir con 1 y salio con $($p.ExitCode)" }
          if (Test-Path "$env:ProgramFiles\LibraEdge\nodo.env") { throw "Sin /CARGA no tenia que instalar nada" }
      - name: Sin vincular, la app muestra «Vincular con el sistema» (V16, ADR-015)
        run: |
          $exe = (Get-ChildItem instalador\salida\*.exe).FullName
          $p = Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SINVINCULAR","/LOG=$env:RUNNER_TEMP\inno-sin-vincular.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:ProgramFiles\LibraEdge\logs\instalacion.log" -Tail 40; throw "Con /SINVINCULAR salio con $($p.ExitCode)" }
          if (Test-Path "$env:ProgramFiles\LibraEdge\nodo.env") { throw "Sin vincular no tenia que configurar el nodo" }
          if (Get-Service LibraEdgeProducto -ErrorAction SilentlyContinue) { throw "Sin vincular no tenia que registrar servicios" }
          $nombre = (Get-Content "instalador\productos\${{ matrix.producto }}.json" -Raw | ConvertFrom-Json).nombre
          $app = "$env:ProgramFiles\LibraEdge\escritorio\$nombre.exe"
          if (-not (Test-Path $app)) { throw "No se instalo la app: $app" }
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path ([Environment]::GetFolderPath("CommonDesktopDirectory")) "$nombre.lnk"))
          if ($lnk.TargetPath -ne $app) { throw "El acceso directo apunta a '$($lnk.TargetPath)' y no a la app" }
          $informe = "$env:RUNNER_TEMP\informe-sin-vincular.txt"
          $env:LIBRAEDGE_ESCRITORIO_INFORME = $informe
          $proc = Start-Process $app -PassThru
          Remove-Item Env:LIBRAEDGE_ESCRITORIO_INFORME
          for ($i = 0; $i -lt 60 -and -not ((Test-Path $informe) -and (Select-String -Path $informe -Pattern "^pantalla vincular$" -Quiet)); $i++) { Start-Sleep 1 }
          if (Test-Path $informe) { Get-Content $informe }
          if (-not (Select-String -Path $informe -Pattern "^pantalla vincular$" -Quiet)) { throw "La app no mostro Vincular con el sistema" }
          if ($proc.HasExited) { throw "La app se cerro (codigo $($proc.ExitCode))" }
          Stop-Process -Id $proc.Id -Force
      - name: Instalar en silencio (V5)
        run: |
          $c = Get-Content instalador\carga-de-prueba.json -Raw | ConvertFrom-Json
          $c.producto = "${{ matrix.producto }}"
          $carga = "$env:RUNNER_TEMP\carga.json"
          $c | ConvertTo-Json -Depth 5 | Set-Content $carga -Encoding ASCII
          $exe = (Get-ChildItem instalador\salida\*.exe).FullName
          $p = Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CARGA=$carga","/LOG=$env:RUNNER_TEMP\inno.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:ProgramFiles\LibraEdge\logs\instalacion.log" -Tail 80 -ErrorAction SilentlyContinue
            Get-Content "$env:RUNNER_TEMP\inno.log" -Tail 40
            throw "La instalacion salio con $($p.ExitCode)"
          }
      - name: Los accesos directos del producto y como se entra (ADR-013)
        run: |
          $definicion = Get-Content "instalador\productos\${{ matrix.producto }}.json" -Raw | ConvertFrom-Json
          $esperado = "--app=http://localhost:$($definicion.puerto)/"
          $icono = "$env:ProgramFiles\LibraEdge\producto.ico"
          $app = "$env:ProgramFiles\LibraEdge\escritorio\$($definicion.nombre).exe"
          if (-not (Test-Path $icono)) { throw "No se instalo $icono" }
          $shell = New-Object -ComObject WScript.Shell
          # "<Producto>": la app de escritorio (ADR-015); "<Producto> (navegador)": Edge en modo aplicacion (ADR-013).
          $accesos = @(
            @{ Ruta = Join-Path ([Environment]::GetFolderPath("CommonDesktopDirectory")) "$($definicion.nombre).lnk"; App = $true },
            @{ Ruta = Join-Path ([Environment]::GetFolderPath("CommonPrograms")) "$($definicion.nombre).lnk"; App = $true },
            @{ Ruta = Join-Path ([Environment]::GetFolderPath("CommonPrograms")) "$($definicion.nombre) (navegador).lnk"; App = $false })
          foreach ($a in $accesos) {
            if (-not (Test-Path $a.Ruta)) { throw "Falta el acceso directo $($a.Ruta)" }
            $lnk = $shell.CreateShortcut($a.Ruta)
            Write-Host "$($a.Ruta) -> $($lnk.TargetPath) $($lnk.Arguments) [$($lnk.IconLocation)]"
            if ($a.App) {
              if ($lnk.TargetPath -ne $app -or $lnk.Arguments) { throw "El destino no es la app: $($lnk.TargetPath) $($lnk.Arguments)" }
            } else {
              if ((Split-Path $lnk.TargetPath -Leaf) -ne "msedge.exe" -or -not (Test-Path $lnk.TargetPath)) { throw "El destino no es Edge: $($lnk.TargetPath)" }
              if ($lnk.Arguments -ne $esperado) { throw "Argumentos '$($lnk.Arguments)'; se esperaba '$esperado'" }
            }
            if ($lnk.IconLocation -ne "$icono,0") { throw "Icono '$($lnk.IconLocation)'; se esperaba '$icono,0'" }
          }
          $acceso = Get-Content "$env:ProgramFiles\LibraEdge\instalador\acceso.txt" -Raw
          Write-Host $acceso
          if ($acceso -notmatch "se entra siempre por la copia local") { throw "acceso.txt no dice como se entra" }
          if ($acceso -notmatch "desde las otras cajas, con http://(10|172|192)\.[0-9.]+:$($definicion.puerto)") { throw "acceso.txt no tiene la IP de la red local" }
          if ((Select-String -Path "$env:RUNNER_TEMP\inno.log" -SimpleMatch "se entra siempre por la copia local").Count -eq 0) { throw "El log de Inno no dice como se entra" }
          if ((Select-String -Path "$env:ProgramFiles\LibraEdge\logs\instalacion.log" -SimpleMatch "desde las otras cajas, con http://").Count -eq 0) { throw "instalacion.log no dice como se entra" }
      - name: Verificar (V6)
        run: |
          Start-Sleep 90
          & "$env:ProgramFiles\LibraEdge\instalador\verificar_nodo.ps1" -SinCentral
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:ProgramFiles\LibraEdge\logs\LibraEdgeProducto.log" -Tail 60 -ErrorAction SilentlyContinue
            exit $LASTEXITCODE
          }
      - name: Login real por http, como desde otra caja (cookie sin Secure, ADR-016)
        # Lo mismo que en Ubuntu: el admin local (su clave sale del nodo.env y no se imprime) contra la IP de la red
        # local, con curl.exe -c/-b. Solo se exige el arreglo si el producto ya trae libraauth >= 0.53.0.
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $definicion = Get-Content "instalador\productos\${{ matrix.producto }}.json" -Raw | ConvertFrom-Json
          $raiz = "$env:ProgramFiles\LibraEdge"
          $py = "$raiz\python\python.exe"
          $archivoEnv = "$raiz\nodo.env"
          if (-not (Select-String -Path $archivoEnv -Pattern '^LIBRAAUTH_COOKIE_SECURE=0$' -CaseSensitive -Quiet)) {
            throw "El nodo.env no apaga la marca Secure de la cookie"
          }
          $version, $estado = ((& $py -I tests\login_por_http.py version) | Out-String).Trim() -split ' '
          Write-Host "libraauth $version en el nodo ($estado)"
          if (@("nueva", "vieja") -notcontains $estado) { throw "No se pudo leer la version de libraauth del nodo" }
          $acceso = Get-Content "$raiz\instalador\acceso.txt" -Raw
          $ip = [regex]::Match($acceso, "http://((10|172|192)\.[0-9.]+):$($definicion.puerto)").Groups[1].Value
          if (-not $ip) { throw "No esta la IP de la red local en acceso.txt" }
          $base = "http://${ip}:$($definicion.puerto)"
          $d = "$env:RUNNER_TEMP\login"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          $prefijo = $null
          foreach ($p in "/api", "/auth") {
            & curl.exe -fsS -o "$d\desafio.json" "$base$p/captcha" 2> $null
            if ($LASTEXITCODE -eq 0) { $prefijo = $p; break }
          }
          if (-not $prefijo) { throw "El producto no contesta $base/api/captcha ni $base/auth/captcha" }
          & $py -I tests\login_por_http.py cuerpo $archivoEnv "$d\desafio.json" "$d\cuerpo.json"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo armar el cuerpo del login" }
          $codigo = & curl.exe -sS -o "$d\login.json" -D "$d\login.cabeceras" -c "$d\frasco" -H "Content-Type: application/json" `
            --data-binary "@$d\cuerpo.json" -w "%{http_code}" "$base$prefijo/login"
          Remove-Item "$d\cuerpo.json" -Force
          if ($codigo -ne "200") { Get-Content "$d\login.json"; throw "POST $prefijo/login dio $codigo" }
          $cookies = @(Get-Content "$d\login.cabeceras" | Where-Object { $_ -match '^set-cookie:' } | ForEach-Object { $_.TrimEnd() })
          if ($cookies.Count -eq 0) { throw "POST $prefijo/login no puso ninguna cookie" }
          Write-Host "Las cookies del login (sin el valor):"
          $cookies | ForEach-Object { Write-Host ($_ -replace '^(set-cookie:\s*[^=]+=)[^;]*', '$1…') }
          $segura = @($cookies | Where-Object { $_ -match ';\s*secure\s*(;|$)' }).Count -gt 0
          $me = & curl.exe -sS -b "$d\frasco" -o "$d\me.json" -w "%{http_code}" "$base$prefijo/me"
          Write-Host "GET $prefijo/me con la cookie: $me"
          if ($estado -eq "nueva") {
            if ($segura) { throw "libraauth $version ya lee LIBRAAUTH_COOKIE_SECURE y la cookie salio Secure" }
            if ($me -ne "200") { Get-Content "$d\me.json"; throw "GET $prefijo/me con la cookie del login dio $me" }
            if ((Get-Content "$d\me.json" -Raw | ConvertFrom-Json).username -ne "admin") { throw "GET $prefijo/me no devolvio al admin" }
            Write-Host "Login por http: cookie sin Secure y GET $prefijo/me autenticado con 200."
          } else {
            Write-Host "::warning::El producto trae libraauth $version (anterior a 0.53.0): la cookie sale Secure=$segura y GET $prefijo/me da $me. Se exige cuando suba el pin."
          }
          exit 0
      - name: La app abre el producto local y vuelve sola si el producto se reinicia (V17, ADR-015)
        run: |
          $definicion = Get-Content "instalador\productos\${{ matrix.producto }}.json" -Raw | ConvertFrom-Json
          $app = "$env:ProgramFiles\LibraEdge\escritorio\$($definicion.nombre).exe"
          $log = "$env:ProgramFiles\LibraEdge\logs\LibraEdgeProducto.log"
          $informe = "$env:RUNNER_TEMP\informe.txt"
          function Esperar($patron, $segundos, $cuantas = 1) {
            for ($i = 0; $i -lt $segundos; $i++) {
              if ((Test-Path $informe) -and @(Select-String -Path $informe -Pattern $patron).Count -ge $cuantas) { return }
              Start-Sleep 1
            }
            if (Test-Path $informe) { Get-Content $informe }
            throw "No aparecio '$patron' en el informe"
          }
          $antes = @(Select-String -Path $log -SimpleMatch '"GET / HTTP/1.1"').Count
          # El arranque cronometrado: el proceso tiene que seguir vivo y haber cargado http://localhost:<puerto>/.
          $env:LIBRAEDGE_ESCRITORIO_INFORME = $informe
          $reloj = [Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process $app -PassThru
          Remove-Item Env:LIBRAEDGE_ESCRITORIO_INFORME
          Esperar "^producto http://localhost:$($definicion.puerto)/" 90
          Write-Host "Cargo el producto en $([int]$reloj.Elapsed.TotalSeconds) s."
          Start-Sleep 5
          if ($proc.HasExited) { throw "La app se cerro (codigo $($proc.ExitCode))" }
          $despues = @(Select-String -Path $log -SimpleMatch '"GET / HTTP/1.1"').Count
          if ($despues -le $antes) { Get-Content $log -Tail 20; throw "El producto no registro el GET / de la app" }
          # Se cae el producto: pantalla de espera propia; vuelve: la app recarga sola.
          Stop-Service LibraEdgeProducto
          Esperar "^pantalla espera$" 60
          Start-Sleep 5
          Start-Service LibraEdgeProducto
          Esperar "^producto http://localhost:$($definicion.puerto)/" 120 2
          Get-Content $informe
          if ($proc.HasExited) { throw "La app se cerro durante el reinicio" }
          Stop-Process -Id $proc.Id -Force
      - name: Ningun secreto en los logs (V7)
        run: |
          $logs = @(Get-ChildItem "$env:RUNNER_TEMP\*.log").FullName + (Get-ChildItem "$env:ProgramFiles\LibraEdge\logs\*.log").FullName
          $n = (Select-String -Path $logs -SimpleMatch "prueba-prueba-prueba-prueba-prueba").Count
          if ($n -ne 0) { throw "El secreto de la carga aparece $n veces en los logs" }
      - name: Desinstalar y reinstalar sobre los mismos datos (V14 y V10)
        run: |
          $env_ = "$env:ProgramFiles\LibraEdge\nodo.env"
          $antes = (Select-String -Path $env_ -Pattern "^SECRET_KEY=").Line
          New-Item -ItemType Directory -Force logs | Out-Null
          Copy-Item "$env:ProgramFiles\LibraEdge\logs\*.log" logs -ErrorAction SilentlyContinue
          Start-Process "$env:ProgramFiles\LibraEdge\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep 10
          if (Test-Path $env_) { throw "Desinstalar no borro nodo.env" }
          $nombre = (Get-Content "instalador\productos\${{ matrix.producto }}.json" -Raw | ConvertFrom-Json).nombre
          foreach ($carpeta in @("CommonDesktopDirectory", "CommonPrograms")) {
            $ruta = Join-Path ([Environment]::GetFolderPath($carpeta)) "$nombre.lnk"
            if (Test-Path $ruta) { throw "Desinstalar no borro el acceso directo $ruta" }
          }
          # La app de escritorio y el respaldo del navegador (ADR-015).
          if (Test-Path "$env:ProgramFiles\LibraEdge\escritorio") { throw "Desinstalar no saco la app de escritorio" }
          $respaldo = Join-Path ([Environment]::GetFolderPath("CommonPrograms")) "$nombre (navegador).lnk"
          if (Test-Path $respaldo) { throw "Desinstalar no borro $respaldo" }
          if (@(Get-Service LibraEdge* -ErrorAction SilentlyContinue).Count -ne 0) { throw "Quedaron servicios" }
          $cons = "$env:ProgramData\LibraEdge\conservado.env"
          if (-not (Test-Path $cons)) { throw "No se guardo conservado.env" }
          if (-not (Test-Path "$env:ProgramData\LibraEdge\datos")) { throw "Desinstalar borro los datos" }
          $c = Get-Content $cons
          if (($c | Where-Object { $_ -notmatch "^(SECRET_KEY|ADMIN_PASSWORD|[A-Z][A-Z0-9_]*_ADMIN_PASSWORD)=" }).Count -ne 0) { throw "conservado.env tiene algo mas que SECRET_KEY y la clave del admin" }
          if ($c -notcontains $antes) { throw "conservado.env no tiene el SECRET_KEY" }
          if ((Select-String -Path $cons -SimpleMatch "prueba-prueba-prueba-prueba-prueba").Count -ne 0) { throw "conservado.env tiene el secreto del nodo" }
          $sids = @((Get-Acl $cons).Access | ForEach-Object { $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value } | Sort-Object -Unique)
          if (($sids -join ",") -ne "S-1-5-18,S-1-5-32-544") { throw "La ACL de conservado.env no es solo SYSTEM y Administradores: $($sids -join ',')" }
          $exe = (Get-ChildItem instalador\salida\*.exe).FullName
          $p = Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CARGA=$env:RUNNER_TEMP\carga.json","/LOG=$env:RUNNER_TEMP\inno-reinstalar.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:ProgramFiles\LibraEdge\logs\instalacion.log" -Tail 60; throw "Reinstalar salio con $($p.ExitCode)" }
          if ((Select-String -Path $env_ -Pattern "^SECRET_KEY=").Line -ne $antes) { throw "Reinstalar cambio el SECRET_KEY" }
          if (Test-Path $cons) { throw "conservado.env no se borro al reinstalar" }
          Start-Sleep 60
          & "$env:ProgramFiles\LibraEdge\instalador\verificar_nodo.ps1" -SinCentral
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: astral-sh/setup-uv@v6
      # En Windows el runner termina los procesos de un paso cuando el paso termina: el central de prueba se levanta en
      # el MISMO paso que lo usa. Con su venv y su Python, no `uv run` (que dejaria tomada la cache de uv).
      - name: Instalar con el codigo contra un central de prueba con https (V15, ADR-014)
        run: |
          $c = "$env:RUNNER_TEMP\central"
          New-Item -ItemType Directory -Force $c | Out-Null
          uv venv -q "$env:RUNNER_TEMP\central-venv"
          uv pip install -q --python "$env:RUNNER_TEMP\central-venv\Scripts\python.exe" ".[server]" trustme
          if ($LASTEXITCODE -ne 0) { throw "No se pudo armar el venv del central de prueba" }
          Start-Process "$env:RUNNER_TEMP\central-venv\Scripts\python.exe" -ArgumentList "tests/central_de_prueba.py",
            "--producto", "${{ matrix.producto }}", "--dir", $c -WindowStyle Hidden `
            -RedirectStandardOutput "$env:RUNNER_TEMP\central.log" -RedirectStandardError "$env:RUNNER_TEMP\central-err.log"
          for ($i = 0; $i -lt 300 -and -not (Test-Path "$c\listo"); $i++) { Start-Sleep 1 }
          if (-not (Test-Path "$c\listo")) { Get-Content "$env:RUNNER_TEMP\central*.log"; throw "El central de prueba no arranco" }
          # Su autoridad, en el almacen de la maquina: el Python embebido del nodo verifica contra ese almacen.
          certutil -addstore -f Root "$c\ca.pem"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar la autoridad de prueba" }

          $base = "https://localhost:8443"
          $exe = (Get-ChildItem instalador\salida\*.exe).FullName
          $env_ = "$env:ProgramFiles\LibraEdge\nodo.env"
          function SecretoDelNodo { ((Select-String -Path $env_ -Pattern "^LIBRAEDGE_NODE_SECRET=").Line -split "=", 2)[1] }
          function SecretoOk($nodo) {
            $id = ((Select-String -Path $env_ -Pattern "^LIBRAEDGE_NODE_ID=").Line -split "=", 2)[1]
            if ($id -ne $nodo) { throw "nodo.env tiene el nodo $id y se emitio $nodo" }
            $cuerpo = @{ node_id = $nodo; secreto = (SecretoDelNodo) } | ConvertTo-Json
            if (-not (Invoke-RestMethod -Method Post "$base/prueba/secreto" -ContentType "application/json" -Body $cuerpo).ok) {
              throw "El secreto del nodo.env no es el que verifica el central"
            }
          }
          function CanjeHttp($codigo) {
            $cuerpo = @{ codigo = $codigo; producto = "${{ matrix.producto }}" } | ConvertTo-Json
            (Invoke-WebRequest -Method Post "$base/sync/v1/vinculacion" -ContentType "application/json" -Body $cuerpo -SkipHttpErrorCheck).StatusCode
          }
          $alta = Invoke-RestMethod -Method Post "$base/api/nodos-offline/vinculacion" -ContentType "application/json" -Body '{"sucursal_id": "1"}'
          Write-Host "::add-mask::$($alta.codigo)"
          if ($alta.direccion -ne "localhost:8443") { throw "La direccion es $($alta.direccion)" }
          $alta.codigo | Out-File -Append -Encoding ascii "$env:RUNNER_TEMP\codigos.txt"

          # En silencio, con el codigo en LIBRAEDGE_CODIGO (no queda en el /LOG) y /DIRECCION=.
          $env:LIBRAEDGE_CODIGO = $alta.codigo
          $p = Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIRECCION=localhost:8443",
            "/LOG=$env:RUNNER_TEMP\inno-codigo.log" -Wait -PassThru
          Remove-Item Env:LIBRAEDGE_CODIGO
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:ProgramFiles\LibraEdge\logs\instalacion.log" -Tail 60
            throw "Instalar con el codigo salio con $($p.ExitCode)"
          }
          SecretoOk $alta.node_id
          if (Test-Path "$env:ProgramData\LibraEdge\carga-nodo.json") { throw "Quedo la carga canjeada" }
          if ((CanjeHttp $alta.codigo) -ne 404) { throw "El codigo sirvio dos veces" }
          if ((Select-String -Path "$env:RUNNER_TEMP\inno-codigo.log" -SimpleMatch $alta.codigo).Count -ne 0) { throw "El codigo quedo en el /LOG" }

          # Otro codigo para el mismo nodo, ahora con /CODIGO= (queda en el /LOG de Inno: documentado en nodo.iss).
          $viejo = SecretoDelNodo
          $otro = Invoke-RestMethod -Method Post "$base/api/nodos-offline/$($alta.node_id)/vinculacion"
          Write-Host "::add-mask::$($otro.codigo)"
          $otro.codigo | Out-File -Append -Encoding ascii "$env:RUNNER_TEMP\codigos.txt"
          $p = Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIRECCION=localhost:8443",
            "/CODIGO=$($otro.codigo)", "/LOG=$env:RUNNER_TEMP\inno-codigo-2.log.inno" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:ProgramFiles\LibraEdge\logs\instalacion.log" -Tail 60; throw "Con /CODIGO= salio con $($p.ExitCode)" }
          SecretoOk $alta.node_id
          if ((SecretoDelNodo) -eq $viejo) { throw "El canje no cambio el secreto" }

          # Un codigo usado: los archivos se copian pero la configuracion falla (20) y el nodo.env queda como estaba.
          $antes = SecretoDelNodo
          $env:LIBRAEDGE_CODIGO = $otro.codigo
          $p = Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIRECCION=localhost:8443",
            "/LOG=$env:RUNNER_TEMP\inno-codigo-usado.log" -Wait -PassThru
          Remove-Item Env:LIBRAEDGE_CODIGO
          if ($p.ExitCode -ne 20) { throw "Con un codigo usado tenia que salir con 20 y salio con $($p.ExitCode)" }
          if ((SecretoDelNodo) -ne $antes) { throw "Un codigo usado cambio el nodo.env" }
          if ((Select-String -Path "$env:ProgramFiles\LibraEdge\logs\instalacion.log" -SimpleMatch "no es v").Count -eq 0) { throw "instalacion.log no dice por que" }

          # Desde la app (ADR-015): la misma funcion que "Vincular con el sistema". La app se relanza elevada (UAC; en
          # el runner no pide nada) y corre instalar.ps1 con el codigo en un archivo del perfil, que se borra.
          $nombre = (Get-Content "instalador\productos\${{ matrix.producto }}.json" -Raw | ConvertFrom-Json).nombre
          $app = "$env:ProgramFiles\LibraEdge\escritorio\$nombre.exe"
          $antes = SecretoDelNodo
          $tercero = Invoke-RestMethod -Method Post "$base/api/nodos-offline/$($alta.node_id)/vinculacion"
          Write-Host "::add-mask::$($tercero.codigo)"
          $tercero.codigo | Out-File -Append -Encoding ascii "$env:RUNNER_TEMP\codigos.txt"
          $entrada = "$env:RUNNER_TEMP\entrada-app.txt"
          [IO.File]::WriteAllText($entrada, "$($tercero.codigo)`n")
          $p = Start-Process $app -ArgumentList "--vincular", "--direccion", "localhost:8443" -RedirectStandardInput $entrada `
            -RedirectStandardOutput "$env:RUNNER_TEMP\app-vincular.log" -PassThru
          if (-not $p.WaitForExit(900000)) { Stop-Process -Id $p.Id -Force; throw "Vincular desde la app no termino en 15 minutos" }
          Remove-Item $entrada
          Get-Content "$env:RUNNER_TEMP\app-vincular.log"
          if ($p.ExitCode -ne 0) { Get-Content "$env:ProgramFiles\LibraEdge\logs\instalacion.log" -Tail 60; throw "Vincular desde la app salio con $($p.ExitCode)" }
          SecretoOk $alta.node_id
          if ((SecretoDelNodo) -eq $antes) { throw "Vincular desde la app no cambio el secreto" }
          if (Get-ChildItem $env:TEMP -Filter "libraedge-vinculo-*" -ErrorAction SilentlyContinue) { throw "Quedo el archivo del codigo" }
          Start-Sleep 60
          & "$env:ProgramFiles\LibraEdge\instalador\verificar_nodo.ps1" -SinCentral
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Ni el secreto ni los codigos en los logs (salvo el /LOG del /CODIGO=, que es el riesgo documentado).
          $logs = @(Get-ChildItem "$env:RUNNER_TEMP\*.log").FullName + (Get-ChildItem "$env:ProgramFiles\LibraEdge\logs\*.log").FullName
          foreach ($buscado in @((SecretoDelNodo), $alta.codigo, $otro.codigo, $tercero.codigo)) {
            $n = (Select-String -Path $logs -SimpleMatch $buscado).Count
            if ($n -ne 0) { throw "Un secreto o un codigo aparece $n veces en los logs" }
          }
      - name: Logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          Copy-Item "$env:RUNNER_TEMP\*.log", "$env:ProgramFiles\LibraEdge\logs\*.log" logs -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.producto }}
          path: logs
          retention-days: 7
      - name: Nombre fijo
        run: |
          New-Item -ItemType Directory -Force publicar | Out-Null
          Copy-Item (Get-ChildItem instalador\salida\*.exe).FullName "publicar\libraedge-nodo-${{ matrix.producto }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.producto }}
          path: publicar
          retention-days: 7

  probar-instalar-nodo:
    name: instalar-nodo.sh en ${{ matrix.ubuntu }}
    needs: deb
    runs-on: ${{ matrix.ubuntu }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ubuntu: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    env:
      PRODUCTO: ventalibra
      SECRETO_DE_PRUEBA: prueba-prueba-prueba-prueba-prueba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-ventalibra
          path: _release
      # El .deb del job y su SHA256SUMS.txt, como los publica el Release (LIBRAEDGE_DEB_DIR en vez de bajar).
      - name: Un Release local
        run: |
          cd _release && sha256sum libraedge-nodo-*.deb > SHA256SUMS.txt && cat SHA256SUMS.txt
          jq --arg p "$PRODUCTO" '.producto = $p' "$GITHUB_WORKSPACE/instalador/carga-de-prueba.json" > "$RUNNER_TEMP/carga.json"
          chmod 600 "$RUNNER_TEMP/carga.json"
      - name: Sin argumentos, sin root u otro sistema, sale con error
        run: |
          set +e
          bash instalador/linux/instalar-nodo.sh; [ $? -eq 2 ] || exit 1
          bash instalador/linux/instalar-nodo.sh "$PRODUCTO" --codigo K7Q4-M2XP; [ $? -eq 2 ] || exit 1
          sudo bash instalador/linux/instalar-nodo.sh "$PRODUCTO" --codigo K7Q4-M2X0 --direccion localhost:8443; [ $? -ne 0 ] || exit 1
          bash instalador/linux/instalar-nodo.sh "$PRODUCTO" "$RUNNER_TEMP/carga.json"; [ $? -ne 0 ] || exit 1
          sudo bash instalador/linux/instalar-nodo.sh otroproducto "$RUNNER_TEMP/carga.json"; [ $? -ne 0 ] || exit 1
          sudo bash instalador/linux/instalar-nodo.sh "$PRODUCTO" /no/esta.json; [ $? -ne 0 ] || exit 1
          echo "Las guardas salen con error."
      - name: Una suma que no coincide no instala
        run: |
          mkdir -p _malo && cp _release/libraedge-nodo-${PRODUCTO}_amd64.deb _malo/
          echo "$(printf '0%.0s' $(seq 64))  libraedge-nodo-${PRODUCTO}_amd64.deb" > _malo/SHA256SUMS.txt
          set +e
          cat instalador/linux/instalar-nodo.sh | sudo LIBRAEDGE_DEB_DIR="$PWD/_malo" bash -s "$PRODUCTO" "$RUNNER_TEMP/carga.json" \
            > "$RUNNER_TEMP/instalar-nodo-malo.log" 2>&1
          codigo=$?
          set -e
          tail -n 5 "$RUNNER_TEMP/instalar-nodo-malo.log"
          [ "$codigo" -ne 0 ] || { echo "Con la suma mala tenia que fallar"; exit 1; }
          if dpkg -s "libraedge-nodo-$PRODUCTO" > /dev/null 2>&1; then echo "no tenia que instalar"; exit 1; fi
      - uses: astral-sh/setup-uv@v6
      - name: Un central de prueba con https (ADR-014)
        run: bash .github/central-de-prueba.sh levantar "$PRODUCTO"
      - name: curl | sudo bash -s con el codigo (con las recomendadas)
        run: |
          . .github/central-de-prueba.sh
          alta="$(emitir /vinculacion '{"sucursal_id": "1"}')"
          codigo="$(jq -r .codigo <<< "$alta")"; echo "::add-mask::$codigo"; echo "$codigo" >> "$RUNNER_TEMP/codigos.txt"
          jq -r .node_id <<< "$alta" > "$RUNNER_TEMP/node_id.txt"
          cat instalador/linux/instalar-nodo.sh \
            | sudo LIBRAEDGE_DEB_DIR="$PWD/_release" bash -s "$PRODUCTO" --codigo "$codigo" --direccion "$DIRECCION" 2>&1 \
            | tee "$RUNNER_TEMP/instalar-nodo.log"
          [ "${PIPESTATUS[1]}" = 0 ]
          secreto_ok "$(cat "$RUNNER_TEMP/node_id.txt")"
          for p in python3-gi gir1.2-ayatanaappindicator3-0.1; do
            dpkg -s "$p" > /dev/null || { echo "no se instalo la recomendada $p"; exit 1; }
          done
          dpkg -s gnome-shell-extension-appindicator > /dev/null 2>&1 || dpkg -s gnome-shell-ubuntu-extensions > /dev/null \
            || { echo "no se instalo la extension de la bandeja"; exit 1; }
          # Al final repite como se entra, con la IP de esta PC (ADR-013).
          tail -n 12 "$RUNNER_TEMP/instalar-nodo.log" | grep -q "se entra siempre por la copia local"
          tail -n 12 "$RUNNER_TEMP/instalar-nodo.log" | grep -Eq "desde las otras cajas, con http://(10|172|192)\.[0-9.]+:8000$"
          apt-cache policy postgresql-16 | grep -m1 apt.postgresql.org
      - name: Verificar (--sin-central) y ni el codigo ni ningun secreto en la salida
        run: |
          sleep 60
          sudo libraedge-nodo-verificar --sin-central
          . .github/central-de-prueba.sh
          sin_secretos_en_los_logs
          echo "Ni el codigo ni ningun secreto en la salida de instalar-nodo.sh."

  publicar:
    name: publicar en el Release
    needs: [compilar, probar-deb, probar-instalar-nodo]
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publicar)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: instalador-*
          merge-multiple: true
          path: publicar
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: publicar
      # El script de una linea (instalar-nodo.sh), al lado de los .deb y en SHA256SUMS.txt.
      - uses: actions/checkout@v4
        with:
          path: _repo
          sparse-checkout: instalador/linux/instalar-nodo.sh
          sparse-checkout-cone-mode: false
      - run: install -m 755 _repo/instalador/linux/instalar-nodo.sh publicar/instalar-nodo.sh
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd publicar
          sha256sum libraedge-nodo-*.exe libraedge-nodo-*.deb instalar-nodo.sh > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "LibraEdge $TAG" --notes "Instaladores del nodo de LibraEdge para Windows 10/11 (64 bits, .exe) y Ubuntu 22.04/24.04/26.04 (amd64, .deb), uno por producto. Cada uno se vincula con la direccion del sistema y el codigo que muestra la pantalla Sucursal sin internet del producto (o con el archivo de carga, para soporte); en Ubuntu, en un paso: curl -fsSL https://github.com/marianocappucci/libraedge/releases/latest/download/instalar-nodo.sh | sudo bash -s <producto> --codigo <codigo> --direccion <direccion>. Antes de publicarse se probaron en runners Windows y Ubuntu contra un central de prueba con https: instalan en silencio con el codigo y pasan verificar_nodo. Los productos entran desde ${REF_PRODUCTO}."
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber libraedge-nodo-*.exe libraedge-nodo-*.deb instalar-nodo.sh SHA256SUMS.txt
