[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "libraedge"
# 0.1.0 -> 0.2.0 (2026-08-30). **Primera version consumible por tag.**
# Hasta hoy este paquete no tenia ningun tag y sus consumidores lo
# pinneaban a la rama develop, o sea a lo que hubiera ahi en el momento
# del build -- un pin flotante en una dependencia de produccion. Dejo de
# ser aceptable cuando Restolibra paso a consumirlo de verdad (Fase 3 del
# nodo espejo): sus tablas se crean en la cadena de Alembic, asi que un
# cambio de schema no anunciado en develop le llegaria al proximo deploy.
#
# 0.2.0 y no 0.1.1: entre 0.1.0 y hoy entraron los dos motores, la bajada
# entera (changelog, pull, espejo) y el enqueue sin commit.
# 0.2.0 -> 0.3.0 (2026-08-30): el nodo pasa a ser un proceso --ciclo de
# sincronizacion, estado y el script libraedge-nodo--. Minor y no patch porque
# OutboxWorker.run_once() cambia de devolver un int a un ResultadoOutbox: la
# cuenta sola no distinguia exito de fracaso, asi que un nodo que la mirara se
# declaraba en linea con la cola atascada. Ningun consumidor actual usa esa
# clase (verificado con grep en libracommerce y restolibra), pero es API publica.
# 0.3.0 -> 0.4.0 (2026-08-30): create_sync_router(), para montar las dos rutas
# DENTRO de la app del producto. create_sync_app recibe conexiones fijas al
# construirse, y eso adentro de un servidor web es una conexion compartida
# entre requests concurrentes que ademas envejece. Las dos conviven: la app
# para un proceso dedicado, el router para el central.
# 0.4.0 -> 0.4.1 (2026-08-30): el handler del router recibe la conexion.
# SyncReceiver llama con un solo argumento y los dos handlers de la familia
# toman (conexion, operacion), asi que montar el router con el handler de
# siempre rechazaba TODAS las operaciones con missing 1 required positional
# argument -- y el nodo se reportaba en linea y sin errores.
# 0.4.1 -> 0.5.0 (2026-08-30): las pruebas de desastre encontraron que una
# operacion colgada en estado sending --por un corte a mitad del envio-- no la
# reintentaba nadie NUNCA: la venta cobrada no llegaba al central y nada
# fallaba. Minor porque el worker cambia de comportamiento al arrancar.
# 0.5.0 -> 0.6.0 (2026-08-30): la ventana de bandeja. La decision de que
# mostrar esta en bandeja.py y probada; el caparazon de Windows no se puede
# ejecutar en este entorno y esta marcado como tal.
# 🔴 La version sale del TAG, no de esta linea.
#
# Estuvo clavada en 0.6.0 mientras los tags iban por v0.6.6: v0.6.1 a v0.6.6
# se publicaron las seis reportando 0.6.0. Lo agarro el chequeo de pines del
# CI de Restolibra --pin=0.6.6 instalado=0.6.0-- y no una persona.
#
# Un numero de version que se escribe a mano se desvia siempre; el que sale
# de `git describe` no puede. Es lo mismo que hace libracore desde el dia uno.
dynamic = ["version"]
description = "Infraestructura edge offline reutilizable de la familia Libra"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Tags sin 'v' inicial (v0.6.6 -> 0.6.6), y sin sufijo local para que un
# commit sin tag no produzca una version que pip rechace.
local_scheme = "no-local-version"

[project.optional-dependencies]
dev = [
    "pytest-cov>=6",
    "ruff>=0.13","pytest>=8.0",
    # SOLO PARA TESTS. Este motor no importa libracore en runtime y sigue
    # teniendo  a proposito -- eso es lo que le evita
    # necesitar una deploy key en el CI. Pero desde la Fase 1 del nodo espejo
    # (2026-08-29) la suite corre contra los DOS motores, y la conexion a
    # PostgreSQL es la de LibraCore: es la misma que le pasa el producto en el
    # nodo, porque las tablas de LibraEdge conviven con las suyas en la misma
    # base. Mismo patron que ya usa LibraCommerce.
    #
    # Pin en v1.59.0 = lo que corre Restolibra, que es el piloto del nodo. Un
    # banco de pruebas que no se parece a produccion no prueba produccion.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.85.0",
]
server = ["fastapi>=0.115", "uvicorn>=0.34", "httpx2>=0.1"]
# El icono de bandeja, que solo se instala en la PC del cliente. Va aparte
# porque el nodo tiene que poder correr como SERVICIO en una maquina sin
# sesion grafica, y ahi un import de GUI sobra.
bandeja = ["pystray>=0.19", "Pillow>=10"]

# La dependencia de tests apunta a un repo de git ().
# Hatchling rechaza esas referencias directas salvo que se declare esto --
# mismo fix que necesito LibraCommerce en su momento (commit 0de3975).
# El proceso del nodo. Hasta la Fase 4 este paquete no tenia entrypoint: era
# una biblioteca que alguien tenia que invocar, y nadie lo hacia.
[project.scripts]
libraedge-nodo = "libraedge.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["libraedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# === lint + coverage (agregado 2026-07-31) ===
# Lint activado en los 12 repos de la familia el mismo dia. El ruleset es
# CURADO, no el default de ruff: el default tiraba entre 132 y 224 hallazgos
# por repo, casi todo estilo, y un lint que arranca en rojo se ignora desde el
# primer dia. Estas reglas dan CERO hallazgos hoy en los 12, asi que cualquier
# rojo futuro es una regresion real y no deuda vieja.
#
# F401 (import sin usar) queda AFUERA A PROPOSITO: son ~396 en la familia y
# buena parte son re-exports deliberados en __init__.py, donde el import ES la
# API publica del modulo. Sacarlos a ciegas rompe a quien importa desde ahi.
# Queda como backlog aparte, para revisar a mano archivo por archivo.
[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "website", "node_modules"]

[tool.ruff.lint]
# Un solo regimen de lint para los 17 repos de la familia (etapa E2 de la
# auditoria, 2026-09-03). Antes convivian dos: este --el que ya usaban
# LibraCargo y LibraClub-- y uno mucho mas corto en los otros 15, que solo
# miraba errores seguros en runtime (E9/F63/F7/F811/F821/F822/F823/F841) y
# no veia orden de imports, modernizacion ni los patrones de bugbear.
#
# La longitud queda en 120, que es la que ya usaban 13 de los 15: bajarla a
# 100 agregaba ~400 E501 en la familia, que no tienen fix automatico y no
# arreglan nada.
select = ["E", "F", "I", "UP", "B"]

# 🔴 TRINQUETE, no "reglas que no importan". Cada linea lleva la cuenta del
# dia que se unifico el regimen: la lista SOLO se achica, y lo que no esta
# aca ya no puede entrar en codigo nuevo. Los casos auto-corregibles
# (orden de imports y modernizacion) se arreglaron en el mismo commit.
ignore = [
    "F401",      # 10 caso(s): import sin usar. 🔴 NO se auto-corrige a proposito: de los 430
              #   de la familia, 168 son RE-EXPORTS —`scripts/panel_admin.py`
              #   re-exporta 27 nombres que `libracore.admin.services` usa como
              #   `pa.find_client`, `pa.compose`, `pa._NPM_AVAILABLE`—. Borrarlos
              #   rompe el backoffice en runtime con los tests en verde.
    "B905",      # 2 caso(s): `zip()` sin `strict=`.
]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las escribe el autogenerate: no se reformatean a mano.
"**/migrations/versions/*.py" = ["E501"]
# En un `__init__.py` el import "sin usar" ES la interfaz del paquete.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` en el default es el idioma de FastAPI, no un descuido.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File",
    "fastapi.Form", "fastapi.Header", "fastapi.Cookie", "fastapi.Body",
]

[tool.coverage.run]
source = ["libraedge"]
branch = true
# bandeja_windows.py queda afuera y NO es para maquillar el numero: es un
# caparazon de GUI de Windows que en este entorno no puede ejecutarse ni una
# linea --no hay Windows ni escritorio--, asi que contarlo mediria la ausencia
# de Windows y no la calidad del codigo.
#
# Lo que se excluye es SOLO el dibujo. Toda la decision de que mostrar vive en
# bandeja.py, esta cubierta, y su docstring dice por que estan separados. Si
# alguna vez una regla se muda al caparazon, sale de la cobertura sin que nadie
# lo note -- por eso la separacion es la que hay que sostener, no el omit.
omit = ["*/tests/*", "*/migrations/*", "*/.venv/*", "*/__main__.py",
        "*/bandeja_windows.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Piso de cobertura. Es un TRINQUETE, no una meta: se fija 2 puntos por
# debajo de lo medido, asi que pasa holgado y lo unico que puede ponerlo en
# rojo es una regresion. Cuando la cobertura suba de verdad, subir tambien
# este numero -- nunca bajarlo para que pase un cambio.
#
# 87 -> 91 el 2026-08-29: la suite paso a correr contra los DOS motores y la
# medicion subio de 89% a 93,27%. Dejarlo en 87 habria dado por bueno perder
# toda la cobertura nueva de PostgreSQL sin que nada se pusiera rojo.
# 91 -> 92 el 2026-08-30: entro la bajada (changelog, pull, espejo de
# referencia) y la medicion quedo en 94,65%.
# 92 -> 94 el 2026-08-30: entro el nodo como proceso (ciclo, estado, CLI). La
# primera medicion dio 90% --por debajo del piso-- y el trinquete hizo lo suyo:
# el CLI estaba al 54%. Se probo en vez de bajar el numero, y quedo en 96,45%.
fail_under = 94
