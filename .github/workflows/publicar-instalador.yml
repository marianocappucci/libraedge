# Compila el instalador del nodo de cada producto, lo PRUEBA en Windows y lo
# publica en el Release del tag (ADR-010).
#
# - Con un tag vX.Y.Z: arma, prueba y publica los tres instaladores en el
#   Release de ese tag, con nombres fijos (libraedge-nodo-<producto>.exe), asi
#   el link de librasuite.com.ar y el de la pantalla del central no cambian:
#   https://github.com/marianocappucci/libraedge/releases/latest/download/libraedge-nodo-<producto>.exe
# - A mano (workflow_dispatch): arma y prueba; publica solo si se pide y se
#   corre sobre un tag.
#
# El instalador no lleva secretos: el del nodo viaja en la carga
# (carga-nodo.json), que emite el central. Por eso puede ser publico.
#
# La prueba es la de PROBAR_EN_VM.md (V4 a V7) sobre el runner de Windows: sin
# /CARGA tiene que salir con 1; con la carga de prueba (un central que no
# existe), instalar con 0, verificar_nodo.ps1 -SinCentral con 0 y ningun
# secreto en los logs. Si algo falla, no se publica nada.
#
# Linux (ADR-012): un .deb por producto (libraedge-nodo-<producto>_<version>_amd64.deb,
# y el alias libraedge-nodo-<producto>_amd64.deb para releases/latest/download/),
# armado en ubuntu-22.04 e instalado y verificado en ubuntu-22.04 y ubuntu-24.04
# (los runners tienen systemd y sudo): sin carga no configura, con la carga de
# prueba configura y verificar_nodo.sh --sin-central da 0, el respaldo restaura,
# reinstalar encima conserva SECRET_KEY, desinstalar conserva los datos y ningun
# secreto queda en los logs.
name: Publicar instalador

on:
  push:
    tags: ["v*"]
  # Un PR que toca el instalador se prueba en Windows (sin publicar): la VM de
  # 2026-10-19 encontro seis bugs que los tests de Linux no veian.
  pull_request:
    branches: [develop, main]
    paths:
      - "instalador/**"
      - "libraedge/instalador.py"
      - ".github/workflows/publicar-instalador.yml"
  workflow_dispatch:
    inputs:
      ref_producto:
        description: "Rama o tag de los productos que entra en el instalador"
        default: main
      publicar:
        description: "Publicar en el Release del tag (solo si se corre sobre un tag)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publicar-instalador-${{ github.ref }}
  cancel-in-progress: false

env:
  # Lo que esta en produccion: los clientes corren main.
  REF_PRODUCTO: ${{ inputs.ref_producto || 'main' }}

jobs:
  paquete:
    name: paquete ${{ matrix.producto }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        producto: [restolibra, ventalibra, contalibra]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: marianocappucci/${{ matrix.producto }}
          ref: ${{ env.REF_PRODUCTO }}
          path: _producto
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # PostgreSQL, Python embebido, NSSM y VC++: lo mismo para los tres.
      - uses: actions/cache@v4
        with:
          path: instalador/paquete/.descargas
          key: descargas-${{ hashFiles('instalador/armar_paquete.sh') }}
      - name: Armar el paquete
        run: instalador/armar_paquete.sh ${{ matrix.producto }} _producto
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-${{ matrix.producto }}
          path: |
            instalador/paquete
            !instalador/paquete/.descargas
          retention-days: 3
      # El frontend construido, para el .deb (asi no se construye dos veces).
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.producto }}
          path: instalador/paquete/${{ matrix.producto }}/producto/frontend/dist
          retention-days: 3

  deb:
    name: deb ${{ matrix.producto }}
    needs: paquete
    # En 22.04: lo que se compile de fuente queda contra la glibc mas vieja que se soporta.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        producto: [restolibra, ventalibra, contalibra]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: marianocappucci/${{ matrix.producto }}
          ref: ${{ env.REF_PRODUCTO }}
          path: _producto
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ matrix.producto }}
          path: _frontend
      - name: Armar el .deb
        run: |
          v=0.0.0
          if [ "${{ github.ref_type }}" = tag ]; then v="${GITHUB_REF_NAME#v}"; fi
          instalador/linux/armar_deb.sh ${{ matrix.producto }} _producto --frontend-dist _frontend --version "$v"
      - name: Los scripts del paquete pasan shellcheck
        run: |
          mkdir -p _control && dpkg-deb -e instalador/salida/*.deb _control
          shellcheck _control/preinst _control/postinst _control/prerm _control/postrm
          dpkg-deb -I instalador/salida/*.deb
      - name: Nombre fijo
        run: |
          mkdir -p publicar
          cp instalador/salida/*.deb publicar/
          cp instalador/salida/*.deb "publicar/libraedge-nodo-${{ matrix.producto }}_amd64.deb"
          ls -l publicar
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.producto }}
          path: publicar
          retention-days: 7

  probar-deb:
    name: probar deb ${{ matrix.producto }} en ${{ matrix.ubuntu }}
    needs: deb
    runs-on: ${{ matrix.ubuntu }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        producto: [restolibra, ventalibra, contalibra]
        ubuntu: [ubuntu-22.04, ubuntu-24.04]
    env:
      DEB: libraedge-nodo-${{ matrix.producto }}_amd64.deb
      PAQUETE: libraedge-nodo-${{ matrix.producto }}
      SECRETO_DE_PRUEBA: prueba-prueba-prueba-prueba-prueba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.producto }}
          path: deb
      - name: PostgreSQL 16 de PGDG (apt.postgresql.org)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          apt-cache policy postgresql-16 | head -n 4
      - name: Con las recomendadas, apt resuelve la bandeja
        run: |
          sudo apt-get install -s "./deb/$DEB" > "$RUNNER_TEMP/simulado.txt"
          for p in python3-gi gir1.2-ayatanaappindicator3-0.1 gnome-shell-extension-appindicator; do
            grep -q "^Inst $p " "$RUNNER_TEMP/simulado.txt" || dpkg -s "$p" > /dev/null 2>&1 \
              || { echo "apt no instalaria $p"; exit 1; }
          done
          # La extension, y que Ubuntu Desktop la trae habilitada para todos: la sesion «ubuntu»
          # la lista en enabled-extensions (ubuntu-settings / ubuntu-session, segun la version).
          mkdir -p _pkgs && cd _pkgs
          apt-get download -q gnome-shell-extension-appindicator ubuntu-settings ubuntu-session
          dpkg-deb -c gnome-shell-extension-appindicator_*.deb | grep -o "extensions/ubuntu-appindicators@ubuntu.com/metadata.json"
          for d in ubuntu-settings_*.deb ubuntu-session_*.deb; do mkdir -p "x-$d" && dpkg-deb -x "$d" "x-$d"; done
          grep -rl "ubuntu-appindicators@ubuntu.com" x-* | tee habilitada.txt
          test -s habilitada.txt
      - name: Instalar sin carga no configura
        run: |
          sudo apt-get install -y -q --no-install-recommends "./deb/$DEB" 2>&1 | tee "$RUNNER_TEMP/apt-sin-carga.log"
          test ! -e /etc/libraedge-nodo/nodo.env
          if systemctl is-active --quiet libraedge-producto; then echo "el producto no tenia que arrancar"; exit 1; fi
          set +e
          sudo libraedge-nodo-instalar > "$RUNNER_TEMP/instalar-sin-carga.log" 2>&1
          codigo=$?
          set -e
          cat "$RUNNER_TEMP/instalar-sin-carga.log"
          [ "$codigo" -ne 0 ] || { echo "Sin carga tenia que salir con algo distinto de 0"; exit 1; }
          test ! -e /etc/libraedge-nodo/nodo.env
      - name: Una carga de otro producto se rechaza sin tocar nada
        run: |
          otro=$(for p in restolibra ventalibra contalibra; do [ "$p" = "${{ matrix.producto }}" ] || { echo "$p"; break; }; done)
          jq --arg p "$otro" '.producto = $p' instalador/carga-de-prueba.json > "$RUNNER_TEMP/carga-otra.json"
          set +e
          sudo libraedge-nodo-instalar "$RUNNER_TEMP/carga-otra.json" > "$RUNNER_TEMP/instalar-otra.log" 2>&1
          codigo=$?
          set -e
          cat "$RUNNER_TEMP/instalar-otra.log"
          [ "$codigo" -ne 0 ] || { echo "Una carga de $otro tenia que rechazarse"; exit 1; }
          if pg_lsclusters --no-header | grep -q " libraedge "; then echo "no tenia que crear el cluster"; exit 1; fi
      - name: Configurar con la carga de prueba
        run: |
          jq --arg p "${{ matrix.producto }}" '.producto = $p' instalador/carga-de-prueba.json > "$RUNNER_TEMP/carga.json"
          chmod 600 "$RUNNER_TEMP/carga.json"
          sudo libraedge-nodo-instalar "$RUNNER_TEMP/carga.json" 2>&1 | tee "$RUNNER_TEMP/instalar.log"
          exit "${PIPESTATUS[0]}"
      - name: Verificar (--sin-central)
        run: |
          sleep 75
          if ! sudo libraedge-nodo-verificar --sin-central; then
            sudo journalctl -u libraedge-producto -u libraedge-nodo -n 80 --no-pager
            exit 1
          fi
      - name: El respaldo restaura
        run: |
          sudo systemctl start libraedge-respaldo.service
          sudo journalctl -u libraedge-respaldo -n 30 --no-pager
          sudo ls -l /var/lib/libraedge-nodo/respaldos
      - name: Reinstalar encima conserva SECRET_KEY (con la carga, sin ella y con ufw activo)
        run: |
          huella() { sudo grep '^SECRET_KEY=' /etc/libraedge-nodo/nodo.env | sha256sum; }
          antes="$(huella)"
          sudo ufw --force enable
          sudo LIBRAEDGE_CARGA="$RUNNER_TEMP/carga.json" apt-get install -y -q --reinstall --no-install-recommends \
            "./deb/$DEB" 2>&1 | tee "$RUNNER_TEMP/apt-reinstalar.log"
          [ "$(huella)" = "$antes" ] || { echo "Reinstalar con la carga cambio SECRET_KEY"; exit 1; }
          sudo apt-get install -y -q --reinstall --no-install-recommends "./deb/$DEB" 2>&1 \
            | tee "$RUNNER_TEMP/apt-actualizar.log"
          [ "$(huella)" = "$antes" ] || { echo "Actualizar sin la carga cambio SECRET_KEY"; exit 1; }
          sudo ufw status | grep -E "^8000/tcp +ALLOW +192\.168\.0\.0/16"
          sleep 30
          sudo libraedge-nodo-verificar --sin-central
      - name: Ningun secreto en los logs
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          sudo journalctl -u 'libraedge-*' -u 'postgresql@16-libraedge' --no-pager > "$RUNNER_TEMP/logs/journal.log"
          sudo cp -r /var/log/libraedge-nodo /var/log/postgresql /var/log/apt/term.log /var/log/dpkg.log "$RUNNER_TEMP/logs/"
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/logs/"
          # La clave de PostgreSQL se busca sin mostrarla.
          clave_pg="$(sudo cat /var/lib/libraedge-nodo/postgres.clave)"
          for secreto in "$SECRETO_DE_PRUEBA" "$clave_pg"; do
            if grep -rqF -- "$secreto" "$RUNNER_TEMP/logs"; then
              echo "Un secreto aparece en: $(grep -rlF -- "$secreto" "$RUNNER_TEMP/logs" | tr '\n' ' ')"
              exit 1
            fi
          done
          echo "Ni el secreto del nodo ni la clave de PostgreSQL aparecen en $(find "$RUNNER_TEMP/logs" -type f | wc -l) logs."
      - name: Desinstalar conserva los datos; purge borra el secreto
        run: |
          sudo apt-get remove -y -q "$PAQUETE"
          if systemctl is-active --quiet libraedge-producto; then echo "el producto sigue corriendo"; exit 1; fi
          sudo test -s /etc/libraedge-nodo/nodo.env
          sudo test -s /var/lib/libraedge-nodo/postgres.clave
          pg_lsclusters --no-header | grep " libraedge "
          sudo apt-get purge -y -q "$PAQUETE"
          sudo test ! -e /etc/libraedge-nodo
          sudo test -s /var/lib/libraedge-nodo/postgres.clave
          sudo test -s /var/lib/libraedge-nodo/app/config.json
          pg_lsclusters --no-header | grep " libraedge "
          test ! -e /opt/libraedge-nodo/python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-deb-${{ matrix.producto }}-${{ matrix.ubuntu }}
          path: ${{ runner.temp }}/logs
          retention-days: 7

  compilar:
    name: compilar y probar ${{ matrix.producto }}
    needs: paquete
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        producto: [restolibra, ventalibra, contalibra]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: paquete-${{ matrix.producto }}
          path: instalador/paquete
      - name: Version
        id: version
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Compilar (V3)
        working-directory: instalador
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DProducto=${{ matrix.producto }} /DVersion=${{ steps.version.outputs.version }} nodo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem salida
      - name: Sin carga no instala (V4)
        run: |
          $exe = (Get-ChildItem instalador\salida\*.exe).FullName
          $p = Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$env:RUNNER_TEMP\inno-sin-carga.log" -Wait -PassThru
          if ($p.ExitCode -ne 1) { throw "Sin /CARGA tenia que salir con 1 y salio con $($p.ExitCode)" }
          if (Test-Path "$env:ProgramFiles\LibraEdge\nodo.env") { throw "Sin /CARGA no tenia que instalar nada" }
      - name: Instalar en silencio (V5)
        run: |
          $c = Get-Content instalador\carga-de-prueba.json -Raw | ConvertFrom-Json
          $c.producto = "${{ matrix.producto }}"
          $carga = "$env:RUNNER_TEMP\carga.json"
          $c | ConvertTo-Json -Depth 5 | Set-Content $carga -Encoding ASCII
          $exe = (Get-ChildItem instalador\salida\*.exe).FullName
          $p = Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CARGA=$carga","/LOG=$env:RUNNER_TEMP\inno.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:ProgramFiles\LibraEdge\logs\instalacion.log" -Tail 80 -ErrorAction SilentlyContinue
            Get-Content "$env:RUNNER_TEMP\inno.log" -Tail 40
            throw "La instalacion salio con $($p.ExitCode)"
          }
      - name: Verificar (V6)
        run: |
          Start-Sleep 90
          & "$env:ProgramFiles\LibraEdge\instalador\verificar_nodo.ps1" -SinCentral
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:ProgramFiles\LibraEdge\logs\LibraEdgeProducto.log" -Tail 60 -ErrorAction SilentlyContinue
            exit $LASTEXITCODE
          }
      - name: Ningun secreto en los logs (V7)
        run: |
          $logs = @(Get-ChildItem "$env:RUNNER_TEMP\*.log").FullName + (Get-ChildItem "$env:ProgramFiles\LibraEdge\logs\*.log").FullName
          $n = (Select-String -Path $logs -SimpleMatch "prueba-prueba-prueba-prueba-prueba").Count
          if ($n -ne 0) { throw "El secreto de la carga aparece $n veces en los logs" }
      - name: Logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          Copy-Item "$env:RUNNER_TEMP\*.log", "$env:ProgramFiles\LibraEdge\logs\*.log" logs -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.producto }}
          path: logs
          retention-days: 7
      - name: Nombre fijo
        run: |
          New-Item -ItemType Directory -Force publicar | Out-Null
          Copy-Item (Get-ChildItem instalador\salida\*.exe).FullName "publicar\libraedge-nodo-${{ matrix.producto }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.producto }}
          path: publicar
          retention-days: 7

  publicar:
    name: publicar en el Release
    needs: [compilar, probar-deb]
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publicar)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: instalador-*
          merge-multiple: true
          path: publicar
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: publicar
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd publicar
          sha256sum libraedge-nodo-*.exe libraedge-nodo-*.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "LibraEdge $TAG" --notes "Instaladores del nodo de LibraEdge para Windows 10/11 (64 bits, .exe) y Ubuntu 22.04/24.04 (amd64, .deb), uno por producto. Cada uno se instala con la carga del nodo (carga-nodo.json) que emite el central del producto. Antes de publicarse se probaron en runners Windows y Ubuntu: instalan en silencio y pasan verificar_nodo. Los productos entran desde ${REF_PRODUCTO}."
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber libraedge-nodo-*.exe libraedge-nodo-*.deb SHA256SUMS.txt
